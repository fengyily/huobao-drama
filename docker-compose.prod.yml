services:
  app:
    image: registry.cn-__ACR_REGION__.aliyuncs.com/__ACR_NAMESPACE__/huobao-drama:latest
    volumes:
      - ./data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml
    environment:
      - PORT=5679
    restart: unless-stopped

  nginx:
    image: __ACR_REGISTRY__/__ACR_NAMESPACE__/nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped

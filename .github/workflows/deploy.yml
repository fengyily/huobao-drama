name: Deploy to Server

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse server config
        id: config
        run: |
          echo "host=$(echo '${{ vars.CONFIG }}' | jq -r '.host')" >> "$GITHUB_OUTPUT"
          echo "user=$(echo '${{ vars.CONFIG }}' | jq -r '.user')" >> "$GITHUB_OUTPUT"
          echo "domain=$(echo '${{ vars.CONFIG }}' | jq -r '.domain')" >> "$GITHUB_OUTPUT"
          echo "deploy_path=$(echo '${{ vars.CONFIG }}' | jq -r '.deploy_path')" >> "$GITHUB_OUTPUT"
          echo "acr_registry=$(echo '${{ vars.CONFIG }}' | jq -r '.acr_registry')" >> "$GITHUB_OUTPUT"
          echo "acr_namespace=$(echo '${{ vars.CONFIG }}' | jq -r '.acr_namespace')" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        run: |
          REGISTRY="${{ steps.config.outputs.acr_registry }}"
          IMAGE="${REGISTRY}/${{ steps.config.outputs.acr_namespace }}/huobao-drama"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Login to Alibaba Cloud ACR
        run: |
          docker login -u '${{ secrets.ACR_USERNAME }}' -p '${{ secrets.ACR_PASSWORD }}' ${{ steps.image.outputs.registry }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.image.outputs.name }}:latest -t ${{ steps.image.outputs.name }}:${{ github.sha }} .
          docker push ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Mirror base images to ACR
        run: |
          ACR_NS="${{ steps.image.outputs.registry }}/${{ steps.config.outputs.acr_namespace }}"

          docker pull nginx:alpine
          docker tag nginx:alpine ${ACR_NS}/nginx:alpine
          docker push ${ACR_NS}/nginx:alpine

          docker pull postgres:16-alpine
          docker tag postgres:16-alpine ${ACR_NS}/postgres:16-alpine
          docker push ${ACR_NS}/postgres:16-alpine

      - name: Generate nginx config
        run: |
          sed 's/__DOMAIN__/${{ steps.config.outputs.domain }}/g' \
            deploy/nginx.conf > deploy/nginx.prod.conf

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.config.outputs.host }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Setup DNS A record
        env:
          DOMAIN: ${{ steps.config.outputs.domain }}
          SERVER_IP: ${{ steps.config.outputs.host }}
          ALI_KEY: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
        run: |
          # Parse domain: ai.hixiu.com → base=hixiu.com, rr=ai
          PARTS=(${DOMAIN//./ })
          COUNT=${#PARTS[@]}
          BASE_DOMAIN="${PARTS[$((COUNT-2))]}.${PARTS[$((COUNT-1))]}"
          if [ "$COUNT" -gt 2 ]; then
            RR=$(echo "$DOMAIN" | sed "s/\.${BASE_DOMAIN}$//")
          else
            RR="@"
          fi

          # Install aliyun CLI
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar xzf aliyun-cli.tgz
          chmod +x aliyun

          ./aliyun configure set --profile default --mode AK \
            --access-key-id "${ALI_KEY}" --access-key-secret "${ALI_SECRET}" --region cn-hangzhou

          # Check if A record already exists
          RECORD_ID=$(./aliyun alidns DescribeDomainRecords \
            --DomainName "${BASE_DOMAIN}" --RRKeyWord "${RR}" --TypeKeyWord A \
            | jq -r '.DomainRecords.Record[]? | select(.RR=="'"${RR}"'") | .RecordId' | head -1)

          if [ -n "$RECORD_ID" ] && [ "$RECORD_ID" != "null" ]; then
            CURRENT_IP=$(./aliyun alidns DescribeDomainRecords \
              --DomainName "${BASE_DOMAIN}" --RRKeyWord "${RR}" --TypeKeyWord A \
              | jq -r '.DomainRecords.Record[]? | select(.RR=="'"${RR}"'") | .Value' | head -1)
            if [ "$CURRENT_IP" = "$SERVER_IP" ]; then
              echo "A record ${RR}.${BASE_DOMAIN} already points to ${SERVER_IP}, skipping"
            else
              echo "Updating A record ${RR}.${BASE_DOMAIN} → ${SERVER_IP}"
              ./aliyun alidns UpdateDomainRecord \
                --RecordId "${RECORD_ID}" --RR "${RR}" --Type A --Value "${SERVER_IP}"
            fi
          else
            echo "Adding A record ${RR}.${BASE_DOMAIN} → ${SERVER_IP}"
            ./aliyun alidns AddDomainRecord \
              --DomainName "${BASE_DOMAIN}" --RR "${RR}" --Type A --Value "${SERVER_IP}"
          fi

      - name: Issue SSL certificate
        env:
          SSH_HOST: ${{ steps.config.outputs.host }}
          SSH_USER: ${{ steps.config.outputs.user }}
          DEPLOY_PATH: ${{ steps.config.outputs.deploy_path }}
          DOMAIN: ${{ steps.config.outputs.domain }}
          ALI_KEY: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"

          $SSH_CMD "sudo mkdir -p ${DEPLOY_PATH}/ssl && sudo chown -R \$(id -u):\$(id -g) ${DEPLOY_PATH}"

          # Install acme.sh if not present
          $SSH_CMD "test -f ~/.acme.sh/acme.sh || (curl -fsSL https://get.acme.sh | sh -s email=acme@${DOMAIN})"

          # Issue cert if not present
          $SSH_CMD "
            if [ ! -f ${DEPLOY_PATH}/ssl/fullchain.pem ]; then
              export Ali_Key='${ALI_KEY}'
              export Ali_Secret='${ALI_SECRET}'
              ~/.acme.sh/acme.sh --issue -d ${DOMAIN} --dns dns_ali --server letsencrypt
              ~/.acme.sh/acme.sh --install-cert -d ${DOMAIN} \
                --key-file ${DEPLOY_PATH}/ssl/privkey.pem \
                --fullchain-file ${DEPLOY_PATH}/ssl/fullchain.pem \
                --reloadcmd 'cd ${DEPLOY_PATH} && sudo docker compose -f docker-compose.prod.yml restart nginx' || true
            fi
          "

      - name: Deploy to server
        env:
          SSH_HOST: ${{ steps.config.outputs.host }}
          SSH_USER: ${{ steps.config.outputs.user }}
          DEPLOY_PATH: ${{ steps.config.outputs.deploy_path }}
          ACR_REGISTRY: ${{ steps.image.outputs.registry }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"
          SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # Create deploy directory and subdirectories
          $SSH_CMD "sudo mkdir -p ${DEPLOY_PATH} && sudo chown -R \$(id -u):\$(id -g) ${DEPLOY_PATH} && mkdir -p ${DEPLOY_PATH}/deploy ${DEPLOY_PATH}/data/static ${DEPLOY_PATH}/configs"

          # Copy config.example.yaml if config.yaml doesn't exist yet
          HAS_CONFIG=$($SSH_CMD "test -f ${DEPLOY_PATH}/configs/config.yaml && echo yes || echo no")
          if [ "$HAS_CONFIG" = "no" ]; then
            $SCP_CMD configs/config.example.yaml ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/configs/config.yaml
          fi

          # Generate docker-compose with actual image names and copy to server
          sed -e "s|image: .*huobao-drama:latest|image: ${IMAGE_NAME}:latest|" \
              -e "s|__ACR_REGISTRY__|${ACR_REGISTRY}|g" \
              -e "s|__ACR_NAMESPACE__|${{ steps.config.outputs.acr_namespace }}|g" \
            docker-compose.prod.yml > docker-compose.deploy.yml
          $SCP_CMD docker-compose.deploy.yml ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml
          $SCP_CMD deploy/nginx.prod.conf ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/deploy/nginx.conf

          # Login to ACR, pull image and restart services
          $SSH_CMD "cd ${DEPLOY_PATH} && \
            sudo docker login -u '${{ secrets.ACR_USERNAME }}' -p '${{ secrets.ACR_PASSWORD }}' ${ACR_REGISTRY} && \
            sudo docker compose -f docker-compose.prod.yml pull && \
            sudo docker compose -f docker-compose.prod.yml up -d && \
            sudo docker image prune -f"

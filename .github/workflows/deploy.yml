name: Deploy to Server

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse server config
        id: config
        run: |
          echo "host=$(echo '${{ vars.CONFIG }}' | jq -r '.host')" >> "$GITHUB_OUTPUT"
          echo "user=$(echo '${{ vars.CONFIG }}' | jq -r '.user')" >> "$GITHUB_OUTPUT"
          echo "domain=$(echo '${{ vars.CONFIG }}' | jq -r '.domain')" >> "$GITHUB_OUTPUT"
          echo "deploy_path=$(echo '${{ vars.CONFIG }}' | jq -r '.deploy_path')" >> "$GITHUB_OUTPUT"
          echo "acr_region=$(echo '${{ vars.CONFIG }}' | jq -r '.acr_region')" >> "$GITHUB_OUTPUT"
          echo "acr_namespace=$(echo '${{ vars.CONFIG }}' | jq -r '.acr_namespace')" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        run: |
          REGISTRY="registry.${{ steps.config.outputs.acr_region }}.aliyuncs.com"
          IMAGE="${REGISTRY}/${{ steps.config.outputs.acr_namespace }}/huobao-drama"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Login to Alibaba Cloud ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: "https://${{ steps.image.outputs.registry }}"
          region-id: ${{ steps.config.outputs.acr_region }}
          access-key-id: ${{ secrets.ALI_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALI_ACCESS_KEY_SECRET }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate nginx config
        run: |
          sed 's/__DOMAIN__/${{ steps.config.outputs.domain }}/g' \
            deploy/nginx.conf > deploy/nginx.prod.conf

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.config.outputs.host }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Issue SSL certificate
        env:
          SSH_HOST: ${{ steps.config.outputs.host }}
          SSH_USER: ${{ steps.config.outputs.user }}
          DEPLOY_PATH: ${{ steps.config.outputs.deploy_path }}
          DOMAIN: ${{ steps.config.outputs.domain }}
          ALI_KEY: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"

          $SSH_CMD "sudo mkdir -p ${DEPLOY_PATH}/ssl && sudo chown -R \$(id -u):\$(id -g) ${DEPLOY_PATH}"

          # Install acme.sh if not present
          $SSH_CMD "test -f ~/.acme.sh/acme.sh || (curl -fsSL https://get.acme.sh | sh -s email=acme@${DOMAIN})"

          # Issue cert if not present
          $SSH_CMD "
            if [ ! -f ${DEPLOY_PATH}/ssl/fullchain.pem ]; then
              export Ali_Key='${ALI_KEY}'
              export Ali_Secret='${ALI_SECRET}'
              ~/.acme.sh/acme.sh --issue -d ${DOMAIN} --dns dns_ali --server letsencrypt
              ~/.acme.sh/acme.sh --install-cert -d ${DOMAIN} \
                --key-file ${DEPLOY_PATH}/ssl/privkey.pem \
                --fullchain-file ${DEPLOY_PATH}/ssl/fullchain.pem \
                --reloadcmd 'cd ${DEPLOY_PATH} && sudo docker compose -f docker-compose.prod.yml restart nginx'
            fi
          "

      - name: Deploy to server
        env:
          SSH_HOST: ${{ steps.config.outputs.host }}
          SSH_USER: ${{ steps.config.outputs.user }}
          DEPLOY_PATH: ${{ steps.config.outputs.deploy_path }}
          ACR_REGISTRY: ${{ steps.image.outputs.registry }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"
          SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # Create deploy directory and subdirectories
          $SSH_CMD "sudo mkdir -p ${DEPLOY_PATH} && sudo chown -R \$(id -u):\$(id -g) ${DEPLOY_PATH} && mkdir -p ${DEPLOY_PATH}/deploy ${DEPLOY_PATH}/data/static ${DEPLOY_PATH}/configs"

          # Copy config.example.yaml if config.yaml doesn't exist yet
          HAS_CONFIG=$($SSH_CMD "test -f ${DEPLOY_PATH}/configs/config.yaml && echo yes || echo no")
          if [ "$HAS_CONFIG" = "no" ]; then
            $SCP_CMD configs/config.example.yaml ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/configs/config.yaml
          fi

          # Generate docker-compose with actual image name and copy to server
          sed "s|image: .*huobao-drama:latest|image: ${IMAGE_NAME}:latest|" \
            docker-compose.prod.yml > docker-compose.deploy.yml
          $SCP_CMD docker-compose.deploy.yml ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml
          $SCP_CMD deploy/nginx.prod.conf ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/deploy/nginx.conf

          # Login to ACR, pull image and restart services
          $SSH_CMD "cd ${DEPLOY_PATH} && \
            sudo docker login -u '${{ secrets.ALI_ACCESS_KEY_ID }}' -p '${{ secrets.ALI_ACCESS_KEY_SECRET }}' ${ACR_REGISTRY} && \
            sudo docker compose -f docker-compose.prod.yml pull && \
            sudo docker compose -f docker-compose.prod.yml up -d && \
            sudo docker image prune -f"
